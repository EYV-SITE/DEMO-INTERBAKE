<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERBAKE - Menú</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 3rem;
            color: #f4a261;
            padding: 0 20px;
        }
        .container-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-menu {
            padding: 20px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background-color: #2a9d8f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
            min-width: 220px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-menu:hover {
            background-color: #264653;
            transform: translateY(-2px);
        }
        .btn-volver {
            margin-top: 4rem;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-volver:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <h2>CATÁLOGOS Y MANUALES EQUIPOS</h2>
    
    <div class="container-buttons">
        <a href="fabricante.html" class="btn-menu">FABRICANTE</a>
        <a href="linea.html" class="btn-menu">LÍNEA PRODUCCIÓN / PRODUCTO</a>
    </div>

    <a href="index.html" class="btn-volver">← Volver al Inicio</a>

</body>
</html>
