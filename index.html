<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERBAKE - Inicio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            font-size: 3.5rem;
            letter-spacing: 3px;
            margin-bottom: 2rem;
            color: #f4a261;
        }
        .btn-ingreso {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #e76f51;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-ingreso:hover {
            background-color: #f4a261;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>INTERBAKE</h1>
    <a href="menu.html" class="btn-ingreso">INGRESO</a>

    <script>
        // PEGA AQUÍ LA URL COMPLETA QUE COPIASTE DE GOOGLE APPS SCRIPT
        const urlGoogleScript = "https://script.google.com/macros/s/AKfycbylXfgnV9GwR1Bq7PnVMqd_2topWlROpf-LIG1WRNkndXrOzTfklQ84WHNJuPMfO6DO5Q/exec";
        // Función que se ejecuta automáticamente al abrir la página
        window.onload = function() {
            // 1. Consultamos el servicio público para saber la IP del visitante
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    const ipVisitante = data.ip;

                    // 2. Enviamos la IP detectada directamente a nuestro Google Sheet
                    fetch(urlGoogleScript, {
                        method: 'POST',
                        mode: 'no-cors', // Evita bloqueos de seguridad del navegador
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ ip: ipVisitante })
                    });
                })
                .catch(error => console.log('Error al registrar acceso:', error));
        }
    </script>

</body>
</html>
